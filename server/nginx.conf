# NGINX vor dem Glowport Sync-Server. Anleitung: docs/sync-server.md
# Ablegen als /etc/nginx/sites-available/glowport-sync, verknüpfen nach sites-enabled, `sync.example.de`
# überall durch die eigene Adresse ersetzen. Das Zertifikat trägt certbot ein (siehe Anleitung).

# Für den WebSocket: „Upgrade“ nur weiterreichen, wenn die Anfrage eines verlangt.
map $http_upgrade $glowport_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name sync.example.de;

    # Ein ganzer Tresor in einem Stück darf so groß sein.
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Der Server bremst Rateversuche je Absender; dafür muss er ihn kennen.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $glowport_connection;
        # Die Verbindung für Anstöße bleibt offen; der Server meldet sich darauf jede Minute.
        proxy_read_timeout 10m;
        proxy_send_timeout 10m;
    }
}
