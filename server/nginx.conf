# NGINX in front of the Glowport sync server. Guide: docs/sync-server.md
# Put it at /etc/nginx/sites-available/glowport-sync, link it into sites-enabled, replace `sync.example.com`
# everywhere with your own address. certbot adds the certificate (see the guide).

# For the WebSocket: only pass “Upgrade” on if the request asks for one.
map $http_upgrade $glowport_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name sync.example.com;

    # A whole vault in one piece may be this large.
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The server slows down guessing attempts per sender; for that it must know it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $glowport_connection;
        # The connection for nudges stays open; the server reports on it every minute.
        proxy_read_timeout 10m;
        proxy_send_timeout 10m;
    }
}
