# Glowport Sync-Server mit Docker. Anleitung: docs/sync-server.md
# Start in diesem Ordner:  docker compose up -d --build
# Einrichtungscode:        docker compose logs glowport-sync
# Verwaltung:              docker compose exec glowport-sync glowport-sync accounts

services:
  glowport-sync:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    # Nur für den vorgeschalteten Webserver auf demselben Rechner erreichbar. Er übernimmt TLS.
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      # Der vorgeschaltete Webserver nennt den Absender in X-Forwarded-For.
      GLOWPORT_SYNC_TRUST_PROXY: "1"
    volumes:
      - glowport-sync-data:/data

volumes:
  glowport-sync-data:
