# Glowport sync server with Docker. Guide: docs/sync-server.md
# Start in this folder:    docker compose up -d --build
# Setup code:              docker compose logs glowport-sync
# Administration:          docker compose exec glowport-sync glowport-sync accounts

services:
  glowport-sync:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    # Only reachable for the web server in front on the same machine. It handles TLS.
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      # The web server in front names the sender in X-Forwarded-For.
      GLOWPORT_SYNC_TRUST_PROXY: "1"
    volumes:
      - glowport-sync-data:/data

volumes:
  glowport-sync-data:
