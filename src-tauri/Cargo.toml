[package]
name = "glowport"
description = "SSH-Client im Neon-Glass-Design"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "glowport_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.1"
zeroize = "1.9.0"
glowport-net = { path = "../crates/net" }
tokio = { version = "1", features = ["sync", "fs", "io-util", "time", "rt", "macros", "net"] }
glowport-core = { path = "../crates/core" }
glowport-import = { path = "../crates/import" }
# Lokales Terminal, Telnet und serielle Leitung.
glowport-extras = { path = "../crates/extras" }
# Abgleich mit dem Sync-Server und geteilte Tresore.
glowport-sync = { path = "../crates/sync" }
glowport-sync-proto = { path = "../crates/sync-proto" }
# Zugriff auf die Schnittstelle von Proxmox VE.
glowport-proxmox = { path = "../crates/proxmox" }
glowport-ftp = { path = "../crates/ftp" }
tauri-plugin-clipboard-manager = "2.4.1"
# Für Server, die nicht UTF-8 sprechen: Die Brücke wandelt in beide Richtungen um.
encoding_rs = "0.8"
# Ortszeit für Namen und Kopf der Mitschnitte.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
drag = "2.1.1"
tauri-plugin-updater = "2"

[dev-dependencies]
# Nur für die Messung der Transfers gegen den eigenen Testserver (`measures_throughput`).
glowport-testserver = { path = "../crates/testserver" }
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
# PuTTY und WinSCP legen ihre Sitzungen in der Registry ab.
winreg = "0.55"
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
