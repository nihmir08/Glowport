[package]
name = "glowport"
description = "SSH-Client im Neon-Glass-Design"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "glowport_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.1"
zeroize = "1.9.0"
glowport-net = { path = "../crates/net" }
tokio = { version = "1", features = ["sync", "fs", "io-util", "time", "rt", "macros", "net"] }
glowport-core = { path = "../crates/core" }
glowport-import = { path = "../crates/import" }
# Local terminal, Telnet and serial line.
glowport-extras = { path = "../crates/extras" }
# Syncing with the sync server and shared vaults.
glowport-sync = { path = "../crates/sync" }
glowport-sync-proto = { path = "../crates/sync-proto" }
# Access to the Proxmox VE API.
glowport-proxmox = { path = "../crates/proxmox" }
glowport-ftp = { path = "../crates/ftp" }
tauri-plugin-clipboard-manager = "2.4.1"
# For servers that do not speak UTF-8: the bridge converts in both directions.
encoding_rs = "0.8"
# Local time for names and headers of recordings.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
drag = "2.1.1"
tauri-plugin-updater = "2"

[dev-dependencies]
# Only for measuring transfers against the own test server (`measures_throughput`).
glowport-testserver = { path = "../crates/testserver" }
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
# PuTTY and WinSCP store their sessions in the registry.
winreg = "0.55"
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
