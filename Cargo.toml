[workspace]
resolver = "2"
members = ["src-tauri", "crates/core", "crates/net", "crates/extras", "crates/import", "crates/testserver", "crates/sync-proto", "crates/sync-server", "crates/sync", "crates/proxmox", "crates/ftp"]
# The RDP core stands on its own, with its own Cargo.lock: IronRDP pins pre-release versions of crypto libraries
# (via `picky` and `sspi`) that cannot be resolved together with those of russh.
exclude = ["crates/rdp"]

[workspace.package]
version = "1.0.2"
edition = "2021"
license = "MIT"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Without optimisation, key derivation would be many times slower; in development it should feel like the release.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# The same goes for RSA: searching for primes takes minutes instead of seconds without optimisation.
[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.crypto-bigint]
opt-level = 3

[profile.dev.package.crypto-primes]
opt-level = 3
