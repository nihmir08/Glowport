[package]
name = "glowport-sync"
description = "Abgleich von Glowport mit dem Sync-Server: die Seite des Programms."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
glowport-core = { path = "../core" }
glowport-sync-proto = { path = "../sync-proto" }
# Dieselbe Einstellung wie beim Updater: rustls ohne mitgebrachten Anbieter; hier wird `ring` ausdrücklich gesetzt
# (baut unter Windows ohne NASM und CMake) und geprüft wird gegen den Zertifikatsspeicher des Systems.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = "0.29"
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
base64 = "0.22"

[features]
# Nur für die eigenen Tests: Verbindungen prüfen gegen ein mitgegebenes Zertifikat statt gegen den Speicher des
# Systems, damit der Abgleich im Test über `https` und `wss` laufen kann. Das Programm baut ohne diesen Schalter.
test-roots = []

[dev-dependencies]
glowport-sync = { path = ".", features = ["test-roots"] }
glowport-sync-server = { path = "../sync-server" }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
