[package]
name = "glowport-sync"
description = "Abgleich von Glowport mit dem Sync-Server: die Seite des Programms."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
glowport-core = { path = "../core" }
glowport-sync-proto = { path = "../sync-proto" }
# The same setup as for the updater: rustls without a bundled provider; here `ring` is set explicitly
# (builds on Windows without NASM and CMake) and certificates are checked against the system's store.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = "0.29"
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
base64 = "0.22"

[features]
# Only for the own tests: check connections against a given certificate instead of the system's
# store, so the sync can run over `https` and `wss` in tests. The program is built without this switch.
test-roots = []

[dev-dependencies]
glowport-sync = { path = ".", features = ["test-roots"] }
glowport-sync-server = { path = "../sync-server" }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
