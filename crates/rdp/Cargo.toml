[package]
name = "glowport-rdp"
description = "RDP-Sitzungen von Glowport: anmelden, Bild als geänderte Bereiche, Eingaben. Kennt weder Tresor noch Oberfläche."
version = "1.0.1"
edition = "2021"
license = "MIT"

[dependencies]
# Der Baukasten IronRDP, ohne dessen fertigen Client (`ironrdp-client`): Der nimmt jedes Zertifikat an und schickt
# bei jeder Änderung das ganze Bild. Der Ablauf hier folgt ihm, prüft aber das Zertifikat und schickt nur Bereiche.
ironrdp-connector = "0.10"
ironrdp-session = "0.11"
ironrdp-tokio = "0.10"
ironrdp-pdu = "0.9"
ironrdp-graphics = "0.9"
ironrdp-displaycontrol = "0.8"
ironrdp-dvc = "0.8"
ironrdp-core = "0.2"
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros", "io-util"] }
# Dieselbe Einstellung wie bei Proxmox und beim Abgleich: rustls mit `ring`, dazu der Zertifikatsspeicher des Systems.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
sha2 = "0.10"
# Für den öffentlichen Schlüssel aus dem Zertifikat des Servers; die Anmeldung über NLA bindet sich daran.
x509-cert = { version = "0.2", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
# Der nachgebaute RDP-Server, gegen den die Sitzung geprüft wird (`tests/session.rs`). Ohne dessen eigene
# Bildverfahren (QOI): Ein Windows schickt sie nie, und die Sitzung meldet sie nicht an.
ironrdp-server = { version = "0.13", default-features = false }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
async-trait = "0.1"
anyhow = "1"
