[package]
name = "glowport-import"
description = "Liest, was andere Programme an Verbindungen gespeichert haben. Kennt weder Dateien noch Registry noch Tresor."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
glowport-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Dateien anderer Programme sind selten UTF-8: UTF-16 aus der Registry, Windows-1252 aus alten INI-Dateien.
encoding_rs = "0.8"
# Nur lesend und ohne weitere Abhängigkeiten; für mRemoteNG, FileZilla und SecureCRT.
roxmltree = "0.21"
# Fingerabdrücke der Server-Schlüssel aus known_hosts, in derselben Form wie OpenSSH.
sha2 = "0.10"
base64 = "0.22"
