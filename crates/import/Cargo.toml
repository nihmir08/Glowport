[package]
name = "glowport-import"
description = "Liest, was andere Programme an Verbindungen gespeichert haben. Kennt weder Dateien noch Registry noch Tresor."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
glowport-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Other programs' files are rarely UTF-8: UTF-16 from the registry, Windows-1252 from old INI files.
encoding_rs = "0.8"
# Read-only and without further dependencies; for mRemoteNG, FileZilla and SecureCRT.
roxmltree = "0.21"
# Fingerprints of the server keys from known_hosts, in the same form as OpenSSH.
sha2 = "0.10"
base64 = "0.22"
