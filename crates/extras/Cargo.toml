[package]
name = "glowport-extras"
description = "Terminals von Glowport jenseits von SSH: Shells dieses Rechners, Telnet, serielle Leitung. Kennt weder Tresor noch Oberfläche."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Only for the shapes of a session (`Session`, `Event`, `Command`): every kind of terminal speaks the same language.
glowport-net = { path = "../net" }
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros", "io-util"] }
# Pseudo terminal for shells on this machine; ConPTY on Windows.
portable-pty = "0.9"
# Without `libudev`: that would need a system library when building on Linux. On Windows it changes nothing.
serialport = { version = "4.10", default-features = false }
# For TCP keepalive with Telnet: the protocol itself has no keepalive.
socket2 = "0.6"

[target.'cfg(windows)'.dependencies]
# Git for Windows and the WSL distributions are listed in the registry.
winreg = "0.55"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
