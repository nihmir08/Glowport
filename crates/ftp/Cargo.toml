[package]
name = "glowport-ftp"
description = "FTP and FTPS for Glowport's file manager. Knows neither vault nor interface."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Only for the file manager's shapes (`Entry`, `Kind`, `FileError`): FTP speaks the same language as SFTP.
glowport-net = { path = "../net" }
# FTPS via rustls with `ring`, as in the rest of the project.
# `deprecated` enables implicit FTPS in the library (port 990); some hosting providers only offer that.
suppaftp = { version = "12.2", default-features = false, features = ["tokio-rustls-ring", "deprecated"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros", "io-util"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs"] }
# The simulated FTP server the tests run against.
libunftp = { version = "0.23", default-features = false, features = ["ring"] }
unftp-sbe-fs = "0.4"
async-trait = "0.1"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
unftp-core = "0.1"
