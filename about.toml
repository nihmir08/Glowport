# Einstellungen für `cargo about`: sammelt die Lizenzen der Rust-Bausteine, die in Glowport stecken.
# Aufgerufen von scripts/lizenzen.mjs, das daraus THIRD-PARTY-LICENSES.md schreibt.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
