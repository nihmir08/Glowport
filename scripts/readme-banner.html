<!doctype html>
<!-- The README's banner. Captured by scripts/readme-images.mjs as docs/images/banner.png (1600 × 560). -->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Space Grotesk'; src: url('../node_modules/@fontsource-variable/space-grotesk/files/space-grotesk-latin-wght-normal.woff2') format('woff2'); font-weight: 300 700; }
  @font-face { font-family: 'Inter'; src: url('../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
  @font-face { font-family: 'JetBrains Mono'; src: url('../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2') format('woff2'); font-weight: 100 800; }
  :root { --accent: #fe9803; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1600px; height: 560px; overflow: hidden; }
  body {
    position: relative;
    font-family: 'Inter', sans-serif;
    color: #e6e6f0;
    background:
      radial-gradient(900px 520px at 6% -12%, color-mix(in srgb, var(--accent) 30%, transparent), transparent 62%),
      radial-gradient(820px 620px at 104% 112%, rgba(255, 46, 99, 0.2), transparent 60%),
      radial-gradient(620px 420px at 72% -8%, rgba(0, 245, 255, 0.1), transparent 60%), #07070c;
  }
  .grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(1000px 520px at 30% 40%, #000 30%, transparent 80%);
  }
  .left { position: absolute; left: 96px; top: 0; bottom: 0; width: 700px; display: flex; flex-direction: column; justify-content: center; gap: 26px; }
  .brand { display: flex; align-items: center; gap: 26px; }
  .brand img { width: 112px; height: 112px; filter: drop-shadow(0 0 36px color-mix(in srgb, var(--accent) 55%, transparent)); }
  h1 { font-family: 'Space Grotesk', sans-serif; font-size: 104px; font-weight: 700; letter-spacing: -3px; line-height: 1; }
  h1 span { color: var(--accent); text-shadow: 0 0 40px color-mix(in srgb, var(--accent) 60%, transparent); }
  p { font-size: 30px; line-height: 1.35; color: #c9c9d6; max-width: 640px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips b {
    font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 16px; color: #f2e6d4;
    padding: 7px 12px; border-radius: 10px;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.1);
    backdrop-filter: blur(8px);
  }
  .chips b.on { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 50%, transparent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .shot {
    position: absolute; left: 860px; top: 70px; width: 860px; border-radius: 20px; overflow: hidden;
    border: 1px solid rgba(255,255,255,.14);
    box-shadow: 0 30px 90px rgba(0,0,0,.6), 0 0 0 1px rgba(0,0,0,.4), 0 0 120px color-mix(in srgb, var(--accent) 18%, transparent);
    transform: perspective(1800px) rotateY(-14deg) rotateX(4deg);
    transform-origin: left center;
  }
  .shot img { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="left">
    <div class="brand"><img src="../src-tauri/icons/icon.png" alt="" /><h1>Glow<span>port</span></h1></div>
    <p>A fast, beautiful SSH client for Windows. Terminal, files, tunnels and an encrypted vault in one window.</p>
    <div class="chips"><b class="on">SSH</b><b>SFTP</b><b>FTP/FTPS</b><b>Mosh</b><b>Telnet</b><b>Serial</b><b>Local shells</b></div>
  </div>
  <div class="shot"><img src="../docs/images/terminals.png" alt="" /></div>
</body>
</html>
