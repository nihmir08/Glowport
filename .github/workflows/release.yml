# Builds Glowport for Windows and publishes it as soon as a tag like v1.2.3 is pushed.
# The release gets the installer, the portable version and latest.json, which installed
# copies use to find the update. Triggered by `node scripts/release.mjs <version>`.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Built into the program: where Glowport looks for updates and which key their signature must match.
      GLOWPORT_UPDATE_URL: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
      GLOWPORT_UPDATE_PUBKEY: dW50cnVzdGVkIGNvbW1lbnQ6IG1pbmlzaWduIHB1YmxpYyBrZXk6IDU3NkFDMUUyRTE4MTcxOUQKUldTZGNZSGg0c0ZxVjh6ajFPNisyZmRIMmh2aUQrNUI4ZEFiTEthdnJGVjlNd1h3M1M5MjZJRUgK
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check tag against version, read notes from CHANGELOG.md
        id: notes
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then echo "::error::Tag $GITHUB_REF_NAME does not match version $version"; exit 1; fi
          node scripts/release-notes.mjs "$version" > notes.md
          { echo 'body<<GLOWPORT_NOTES'; cat notes.md; echo 'GLOWPORT_NOTES'; } >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Glowport __VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: --config src-tauri/tauri.release.conf.json

      - name: Attach the portable version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/portable.mjs
          gh release upload "$GITHUB_REF_NAME" target/release/bundle/portable/*.zip --clobber
